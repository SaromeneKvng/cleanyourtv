plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist.
        // Xiaomi: docs/devices/xiaomi-mitv-aetp0-dofus.md (com.ts.launcher).
        // ColorOS TV: docs/devices/oppo-k9-55-oppocnm632.md (com.oneplus.tv.launcher2).
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 15
        versionName '3.6'
        // Personal fork: the Rive runtime is native code, built here only for 32-bit ARM, which this TV runs.
        ndk { abiFilters 'armeabi-v7a' }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Personal fork: Rive asks for androidx.core 1.17 (compileSdk 36, AGP 8.9). The launcher builds against SDK 34 with
// AGP 8.5, so pin core to the last release that does; Rive's view code uses nothing newer from it.
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.13.1'
        force 'androidx.core:core-ktx:1.13.1'
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Personal fork: plays the Home effects .riv (petals, bloom, clock) built with the Rive CLI (rive_home).
    // Only the classic RiveAnimationView is used, so its Jetpack Compose wrapper (and the newer SDK it needs) stays out.
    implementation('app.rive:rive-android:11.16.0') {
        exclude group: 'androidx.compose.ui'
        exclude group: 'androidx.compose.runtime'
        exclude group: 'androidx.compose.foundation'
        exclude group: 'androidx.compose'
        exclude group: 'androidx.lifecycle', module: 'lifecycle-runtime-compose'
    }
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
